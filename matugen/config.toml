[config]

[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty.toml"
output_path = "~/.config/alacritty/colors.toml"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland.conf"
output_path = "~/.config/hypr/colors.conf"
post_hook = "hyprctl reload"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill -SIGUSR2 waybar"

[templates.wlogout]
input_path = "~/.config/matugen/templates/wlogout-colors.css"
output_path = "~/.config/wlogout/colors.css"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/powermenu.rasi"

[templates.bluetooth]
input_path = "~/.config/matugen/templates/bluetooth.rasi"
output_path = "~/.config/rofi/bluetooth.rasi"

[templates.wallpaper]
input_path = "~/.config/matugen/templates/wallpaper.rasi"
output_path = "~/.config/rofi/wallpaper.rasi"
